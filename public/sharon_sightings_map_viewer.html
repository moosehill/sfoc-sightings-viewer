<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sharon Sightings Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<style>
  :root {
    --blue: #2563eb; --green: #16a34a; --purple: #7c3aed; --gray: #6b7280;
    --bg: #f8fafc; --panel: #ffffff; --border: #e2e8f0; --text: #1e293b; --muted: #64748b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text); background: var(--bg); }
  #app { display: flex; height: 100vh; width: 100vw; }
  #map { flex: 1 1 auto; height: 100%; }
  #sidebar { width: 380px; flex: 0 0 380px; height: 100%; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--border); }

  #header { padding: 12px 14px 10px; border-bottom: 1px solid var(--border); }
  #header h1 { font-size: 15px; margin: 0 0 2px; }
  #header .date-range { font-size: 11.5px; color: var(--muted); margin: 0 0 8px; }
  #header .sw-version { font-weight: 400; font-size: 10px; color: var(--muted); vertical-align: middle; }
  #stats { display: flex; flex-wrap: wrap; gap: 6px; font-size: 11px; }
  .stat { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 3px 7px; }
  .stat b { display: block; font-size: 13px; }

  #detail { border-bottom: 2px solid var(--border); padding: 12px 14px; background: #fbfcfe; max-height: 34vh; overflow-y: auto; flex: 0 0 auto; }
  #detail.empty { color: var(--muted); font-size: 12.5px; text-align: center; padding: 22px 14px; }
  #detail h2 { font-size: 14px; margin: 0 0 2px; }
  #detail .sci { font-style: italic; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .field { font-size: 12px; margin-bottom: 4px; }
  .field b { color: var(--muted); font-weight: 600; margin-right: 4px; }

  #toolbar { padding: 8px 14px; border-bottom: 1px solid var(--border); }
  #search { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }

  #listHeader { padding: 10px 14px 6px; font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .02em; }
  #list { flex: 1 1 auto; overflow-y: auto; }
  .row { padding: 8px 14px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 12.5px; }
  .row:hover { background: #f1f5f9; }
  .row.selected { background: #eff6ff; border-left: 3px solid var(--blue); }
  .row .name { font-weight: 600; }
  .row .sub { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  #loadmore { display: block; width: 100%; padding: 10px; border: none; background: var(--bg); color: var(--muted); cursor: pointer; font-size: 12px; }

  .leaflet-tooltip.sfoc-tip { font-size: 12px; padding: 5px 8px; }

  /* Drag handle for resizing map vs. sidebar on mobile. Hidden entirely on
     desktop (side-by-side layout has nothing to drag). */
  #dragHandle {
    display: none;
    flex: 0 0 auto;
    height: 18px;
    background: var(--bg);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    align-items: center;
    justify-content: center;
    cursor: row-resize;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #dragHandle::before {
    content: '';
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
  }
  #dragHandle:active::before { background: var(--muted); }

  /* Phones/narrow screens: stack map above the sidebar instead of side-by-side,
     otherwise a fixed-width sidebar eats almost the whole screen. Map height
     defaults to half the screen but is adjustable via #dragHandle, which sets
     the --map-height custom property. */
  @media (max-width: 700px) {
    #app { flex-direction: column; height: 100dvh; }
    #map { flex: 0 0 var(--map-height, 50dvh); height: var(--map-height, 50dvh); width: 100%; min-height: 120px; }
    #dragHandle { display: flex; }
    #sidebar { width: 100%; flex: 1 1 auto; min-height: 0; border-left: none; border-top: none; }
    #detail { max-height: 26dvh; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="dragHandle" title="Drag to resize"></div>
  <div id="sidebar">
    <div id="header">
      <h1>Sharon Sightings Map <span class="sw-version">v2</span></h1>
      <div class="date-range">May 2004 - Jul 2026</div>
      <div id="stats"></div>
    </div>
    <div id="detail" class="empty">Click on a data point for more information.</div>
    <div id="toolbar">
      <input id="search" type="text" placeholder="Search species or location…" />
    </div>
    <div id="listHeader"></div>
    <div id="list"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

const DATA = DATA_RAW
  .filter(function(r) { return r.Latitude !== "" && r.Longitude !== ""; })
  .map(function(r) {
    return Object.assign({}, r, {
      lat: parseFloat(r.Latitude),
      lon: parseFloat(r.Longitude),
    });
  });
const byId = {};
DATA.forEach(function(d){ byId[d.id] = d; });

// ---- Map setup ----
const map = L.map('map', { preferCanvas: true }).setView([42.1237, -71.1787], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const cluster = L.markerClusterGroup({
  maxClusterRadius: 40,
  spiderfyOnMaxZoom: true,
  disableClusteringAtZoom: null,
  zoomToBoundsOnClick: true
});
map.addLayer(cluster);

const markerById = {};

const DEFAULT_STYLE = { radius: 7, weight: 2, color: '#ffffff', fillColor: '#2563eb', fillOpacity: 0.95 };
const HIGHLIGHT_STYLE = { radius: 11, weight: 3, color: '#f59e0b', fillColor: '#2563eb', fillOpacity: 1 };

function makeMarker(d) {
  const m = L.circleMarker([d.lat, d.lon], Object.assign({
    // L.circleMarker is a Path layer, which by default bubbles mouse events
    // up to the map. Leaflet.markercluster listens for map clicks to
    // auto-collapse any open spiderfy, so without this, clicking a
    // spiderfied point closes the whole cloud it belongs to.
    bubblingMouseEvents: false
  }, DEFAULT_STYLE));
  m.sfocId = d.id;
  m.bindTooltip(tooltipHtml(d), { className: 'sfoc-tip', direction: 'top', offset: [0, -6] });
  m.on('click', function(e) {
    L.DomEvent.stopPropagation(e);
    selectPoint(d.id, true);
  });
  return m;
}
function tooltipHtml(d) {
  return '<b>' + escapeHtml(d.CommonName) + '</b><br>' + escapeHtml(d.ObservationLocation) +
         '<br><span style="color:#888">' + escapeHtml(d.ObservationDate) + '</span>';
}
function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

DATA.forEach(function(d) {
  const m = makeMarker(d);
  markerById[d.id] = m;
  cluster.addLayer(m);
});

// ---- Sidebar state ----
// viewportIds: recomputed on every map move/zoom -- the default list.
// explicitScope: set by clicking a cluster or a point; overrides viewportIds
//   until the user genuinely pans/zooms the map themselves.
// currentSearch: when non-empty, overrides everything and searches all DATA.
let viewportIds = [];
let explicitScope = null;
let currentSearch = '';
let selectedId = null;
let renderLimit = 200;

// Cluster clicks and our own point-selection code both trigger an animated
// map pan/zoom (zoomToBoundsOnClick, and map.setView respectively), which
// fires 'moveend' just like a real user drag or scroll would. Without this
// flag, that programmatic movement would immediately wipe out the very
// cluster/point scope the click was meant to set. Set it right before
// triggering such a move; the next moveend consumes it and resets itself.
let suppressViewportReset = false;
function suppressNextViewportReset() {
  suppressViewportReset = true;
  // Safety net: if for some reason no moveend arrives to consume the flag
  // (e.g. the target view was identical to the current one), don't leave it
  // stuck true and accidentally swallow the user's next real pan/zoom.
  setTimeout(function() { suppressViewportReset = false; }, 1000);
}

// The currently-highlighted marker (the one shown in the detail pane, when
// selected via the sidebar list / zoomToShowLayer). Cleared -- reverted to
// its normal style -- whenever the user genuinely pans or zooms the map.
let highlightedId = null;
function setHighlight(id) {
  if (highlightedId != null && markerById[highlightedId]) {
    markerById[highlightedId].setStyle(DEFAULT_STYLE);
  }
  highlightedId = id;
  if (id != null && markerById[id]) {
    markerById[id].setStyle(HIGHLIGHT_STYLE);
    if (markerById[id].bringToFront) { markerById[id].bringToFront(); }
  }
}

function updateViewportIds() {
  const bounds = map.getBounds();
  viewportIds = DATA.filter(function(d) { return bounds.contains([d.lat, d.lon]); })
                     .map(function(d) { return d.id; });
}
updateViewportIds();

map.on('moveend', function() {
  updateViewportIds();
  if (suppressViewportReset) {
    suppressViewportReset = false;
  } else {
    explicitScope = null;
    setHighlight(null);
  }
  renderList();
});

cluster.on('clusterclick', function(e) {
  const ids = e.layer.getAllChildMarkers().map(function(m) { return m.sfocId; });
  explicitScope = ids;
  selectedId = null;
  setHighlight(null);
  renderLimit = 200;
  suppressNextViewportReset();
  renderList();
  renderDetail();
});

// Tracks whichever marker currently has its tooltip programmatically opened,
// so selecting a new point always closes the previous tooltip first --
// otherwise tooltips only close on hover-out, and clicking through several
// points (from the map or the list) would leave every prior one on screen.
let openTooltipId = null;
function closeOpenTooltip() {
  if (openTooltipId != null && markerById[openTooltipId]) {
    markerById[openTooltipId].closeTooltip();
  }
  openTooltipId = null;
}
function showTooltip(id) {
  closeOpenTooltip();
  const m = markerById[id];
  if (m) { m.openTooltip(); openTooltipId = id; }
}

function selectPoint(id, fromMap) {
  selectedId = id;
  const inCurrentList = getBaseIds().indexOf(id) !== -1;
  if (!inCurrentList) {
    // Directly clicked (or searched to) a point that isn't part of the list
    // currently shown -- make the list reflect just this one point.
    explicitScope = [id];
    currentSearch = '';
    document.getElementById('search').value = '';
    renderLimit = 200;
  }
  renderList();
  renderDetail();
  const m = markerById[id];
  if (fromMap) {
    // Already visible on screen (that's how it was clicked) -- just
    // highlight it, don't move the map. Leaflet.markercluster automatically
    // collapses any open spiderfied cluster the instant the map pans or
    // zooms, so re-centering here would close the very cloud of points the
    // user just clicked into.
    setHighlight(id);
    showTooltip(id);
  } else {
    // Selected from the sidebar list -- the full record is already shown in
    // the detail pane, so no map tooltip is needed here (and any tooltip
    // left open from an earlier map click should be closed). The point
    // could be hidden inside a cluster anywhere on the map; zoomToShowLayer
    // zooms in (and spiderfies, if the point is still clustered even at max
    // zoom) however much is needed to make it individually visible.
    suppressNextViewportReset();
    closeOpenTooltip();
    if (m) {
      cluster.zoomToShowLayer(m, function() {
        setHighlight(id);
      });
    }
  }
}

function matchesSearch(d) {
  const hay = (d.CommonName + ' ' + d.ObservationLocation + ' ' + d.ScientificName + ' ' + d.Observer).toLowerCase();
  return hay.indexOf(currentSearch) !== -1;
}

function getBaseIds() {
  const base = explicitScope || viewportIds;
  if (currentSearch) {
    return base.filter(function(id) { return matchesSearch(byId[id]); });
  }
  return base;
}

function renderStats() {
  const el = document.getElementById('stats');
  el.innerHTML = '<div class="stat"><b>' + DATA.length + '</b>sightings mapped</div>';
}

function listHeaderText(count) {
  if (currentSearch) {
    return count + (count === 1 ? ' result' : ' results') + ' for “' + currentSearch + '”';
  }
  if (explicitScope) {
    return count + (count === 1 ? ' sighting here' : ' sightings here');
  }
  return count + (count === 1 ? ' sighting in view' : ' sightings in view');
}

function renderList() {
  const headerEl = document.getElementById('listHeader');
  const listEl = document.getElementById('list');
  listEl.innerHTML = '';

  const ids = getBaseIds();
  const items = ids.map(function(id) { return byId[id]; }).filter(Boolean);
  headerEl.textContent = listHeaderText(items.length);

  const toShow = items.slice(0, renderLimit);
  toShow.forEach(function(d) {
    const row = document.createElement('div');
    row.className = 'row' + (d.id === selectedId ? ' selected' : '');
    row.innerHTML = '<div class="name">' + escapeHtml(d.CommonName) + '</div>' +
      '<div class="sub">' + escapeHtml(d.ObservationDate) + ' — ' + escapeHtml(d.ObservationLocation) + '</div>';
    row.onclick = function() { selectPoint(d.id, false); };
    listEl.appendChild(row);
  });
  if (items.length > renderLimit) {
    const btn = document.createElement('button');
    btn.id = 'loadmore';
    btn.textContent = 'Load ' + Math.min(200, items.length - renderLimit) + ' more (' + (items.length - renderLimit) + ' remaining)';
    btn.onclick = function() { renderLimit += 200; renderList(); };
    listEl.appendChild(btn);
  }
}

function renderDetail() {
  const el = document.getElementById('detail');
  if (selectedId == null) {
    el.classList.add('empty');
    el.innerHTML = 'Click on a data point for more information.';
    return;
  }
  const d = byId[selectedId];
  el.classList.remove('empty');
  el.innerHTML =
    '<h2>' + escapeHtml(d.CommonName) + '</h2>' +
    '<div class="sci">' + escapeHtml(d.ScientificName || '') + '</div>' +
    '<div class="field"><b>Observer:</b>' + escapeHtml(d.Observer) + '</div>' +
    '<div class="field"><b>Date/Time:</b>' + escapeHtml(d.ObservationDate) + ' ' + escapeHtml(d.ObservationTime || '') + '</div>' +
    '<div class="field"><b>Location:</b>' + escapeHtml(d.ObservationLocation) + '</div>' +
    (d.PostUrl ? '<div class="field"><a href="' + escapeHtml(d.PostUrl) + '" target="_blank" rel="noopener">View original sighting post →</a></div>' : '');
}

document.getElementById('search').addEventListener('input', function(e) {
  currentSearch = e.target.value.trim().toLowerCase();
  renderLimit = 200;
  renderList();
});

// ---- Mobile drag-to-resize (map height vs. sidebar) ----
// Only meaningful in the stacked mobile layout (see the max-width: 700px
// media query) -- on desktop the handle is display:none and never receives
// pointer events, so this code is simply inert there.
(function() {
  const handle = document.getElementById('dragHandle');
  const MIN_PCT = 0.15, MAX_PCT = 0.85;
  let dragging = false;
  let latestPct = null;
  let rafScheduled = false;

  function setMapHeightPct(pct) {
    pct = Math.max(MIN_PCT, Math.min(MAX_PCT, pct));
    document.documentElement.style.setProperty('--map-height', (pct * 100) + 'dvh');
    // The map's container size just changed outside of Leaflet's own
    // control -- without this it misjudges its pixel dimensions and tiles
    // render into the wrong area (or don't render at all) until the next
    // pan/zoom.
    if (map && map.invalidateSize) { map.invalidateSize(); }
  }

  function onPointerDown(e) {
    if (!window.matchMedia('(max-width: 700px)').matches) return;
    dragging = true;
    if (handle.setPointerCapture) { handle.setPointerCapture(e.pointerId); }
  }
  function onPointerMove(e) {
    if (!dragging) return;
    const appRect = document.getElementById('app').getBoundingClientRect();
    latestPct = (e.clientY - appRect.top) / appRect.height;
    if (!rafScheduled) {
      rafScheduled = true;
      requestAnimationFrame(function() {
        setMapHeightPct(latestPct);
        rafScheduled = false;
      });
    }
  }
  function onPointerUp() { dragging = false; }

  handle.addEventListener('pointerdown', onPointerDown);
  handle.addEventListener('pointermove', onPointerMove);
  handle.addEventListener('pointerup', onPointerUp);
  handle.addEventListener('pointercancel', onPointerUp);
})();

// ---- init ----
renderStats();
renderList();
renderDetail();
</script>
</body>
</html>
